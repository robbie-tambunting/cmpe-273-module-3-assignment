syntax = "proto3";

package inventory.v1;

service InventoryService {
  rpc ReserveInventory(ReserveRequest) returns (ReserveResponse);
}

message ReserveRequest {
  string item_id = 1;
  int32 quantity = 2;
  string idempotency_key = 3;
}

message ReserveResponse {
  string reservation_id = 1;
  string item_id = 2;
  int32 quantity = 3;
}
